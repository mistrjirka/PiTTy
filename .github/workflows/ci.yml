name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/bun/install.js
      - run: npm run build:runtime
      - run: node bin/pitty.mjs --help
      - run: npm run typecheck
      - name: Verify managed Monty native runtime
        if: runner.os != 'Windows'
        run: |
          npm ci --prefix vendor/monty-runtime --ignore-scripts --omit=dev --include=optional --no-audit --no-fund
          node scripts/check-managed-monty.mjs vendor/monty-runtime
      - run: npm run test:unit

  shell-installer-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: sh -n uninstall.sh
