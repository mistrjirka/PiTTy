<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="285" height="176" viewBox="0 0 285 176" role="img" aria-label="PiTTy terminal preview" xml:space="preserve">
<rect width="100%" height="100%" fill="#10131a"/>
<metadata>PiTTy terminal preview rendered from an ANSI capture using the SGR palette. This image is self-contained for README embedding.</metadata>
<desc>Deterministic terminal UI preview with monospace text and ANSI colors.</desc>
<style>text{font-family:monospace;font-size:14px;white-space:pre;fill:#d8dee9}.red{fill:#ff6b6b}.green{fill:#8bd49c}.yellow{fill:#f2c879}.magenta{fill:#d7a5ff}.cyan{fill:#7bdff2}.white{fill:#fff}.dim{fill:#748096}</style>
<text x="12" y="26"><tspan class="cyan">Fork conversation</tspan></text>
<text x="12" y="45"></text>
<text x="12" y="64"><tspan>  ▸ Continue from latest answer</tspan></text>
<text x="12" y="83"><tspan>    Fork from user prompt</tspan></text>
<text x="12" y="102"><tspan>    Fork from tool result</tspan></text>
<text x="12" y="121"><tspan>    Start a fresh branch</tspan></text>
<text x="12" y="140"></text>
<text x="12" y="159"><tspan>  Enter select   Esc cancel</tspan></text>
</svg>
